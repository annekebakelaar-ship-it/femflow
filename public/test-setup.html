<!DOCTYPE html>
<html>
<head>
  <title>Test Menstruation Setup</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #status { padding: 10px; margin-bottom: 20px; border-radius: 8px; }
    .ok { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    #screenshot { margin-top: 20px; width: 100%; max-width: 500px; }
  </style>
</head>
<body>
  <h1>FemFlow Menstruation Setup Test</h1>
  <div id="status" class="ok">Loading app...</div>

  <button onclick="testApp()">Test Setup Slideshow</button>
  <button onclick="window.location.href='http://localhost:5178/health/menstruation'">Go to Full App</button>

  <pre id="log" style="margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 8px; overflow: auto; max-height: 300px;"></pre>

  <script>
    const log = (msg) => {
      console.log(msg);
      document.getElementById('log').textContent += msg + '\n';
    };

    const setStatus = (msg, ok = true) => {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ok ? 'ok' : 'error';
    };

    async function testApp() {
      log('Testing MenstruationSetupSlideshow component...\n');

      try {
        // Check if components are loaded by fetching the page
        const response = await fetch('/health/menstruation');
        if (response.ok) {
          log('✓ Page loads successfully');
          const html = await response.text();

          if (html.includes('root')) {
            log('✓ React root element found');
          } else {
            log('✗ React root element NOT found');
          }

          if (html.includes('YOUCAPS')) {
            log('✓ YOUCAPS branding loaded');
          }

          setStatus('✓ Tests passed! Check the live app below.', true);
        } else {
          log('✗ Page failed to load: ' + response.status);
          setStatus('✗ Page failed to load', false);
        }
      } catch (err) {
        log('✗ Error: ' + err.message);
        setStatus('✗ Error occurred', false);
      }
    }

    // Auto-test on load
    window.addEventListener('load', () => {
      setTimeout(testApp, 500);
    });
  </script>

  <h2>Live Application Preview</h2>
  <iframe id="preview" src="/health/menstruation" style="width: 100%; height: 600px; border: 1px solid #ccc; border-radius: 8px; margin-top: 20px;"></iframe>
</body>
</html>
