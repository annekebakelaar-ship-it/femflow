<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouCaps Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f9f9f9; color: #1a1a1a; }
  .login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 40px; width: 340px; }
  .login-box h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.5px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; }
  input:focus { border-color: #1a1a1a; }
  button { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #333; }
  .err { color: #c62828; font-size: 13px; margin-top: 8px; }
  .dash { display: none; padding: 40px; max-width: 1100px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -1px; }
  .logout { background: none; border: 1px solid #e0e0e0; color: #888; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; width: auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px 24px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 6px; }
  .stat-value { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
  .stat-sub { font-size: 12px; color: #888; margin-top: 4px; }
  .stat.green .stat-value { color: #2e7d32; }
  .stat.orange .stat-value { color: #e67e22; }
  .early-bar { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px 24px; margin-bottom: 32px; }
  .early-bar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 12px; }
  .bar-track { background: #f0f0f0; border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-fill { background: #1a1a1a; height: 100%; border-radius: 999px; transition: width .5s ease; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-top: 6px; }
  table { width: 100%; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; border-collapse: collapse; overflow: hidden; }
  th { text-align: left; padding: 14px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; border-bottom: 1px solid #e5e5e5; font-weight: 500; }
  td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.active { background: #e8f5e9; color: #2e7d32; }
  .badge.pending { background: #fff8e1; color: #f57f17; }
  .badge.cancelled { background: #fce4ec; color: #c62828; }
  .empty { text-align: center; padding: 48px; color: #888; font-size: 14px; }
</style>
</head>
<body>

<div class="login" id="loginView">
  <div class="login-box">
    <h1>YouCaps Admin</h1>
    <input type="password" id="keyInput" placeholder="Admin key" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Inloggen</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="dash" id="dashView">
  <div class="header">
    <h1>YOUCAPS — Admin</h1>
    <button class="logout" onclick="doLogout()">Uitloggen</button>
  </div>
  <div class="stats" id="statsGrid"></div>
  <div class="early-bar" id="earlyBar"></div>
  <table>
    <thead>
      <tr>
        <th>E-mail</th><th>Status</th><th>Plan</th><th>Bedrag</th><th>Aangemeld</th><th>Opgezegd</th>
      </tr>
    </thead>
    <tbody id="subTable"><tr><td colspan="6" class="empty">Laden...</td></tr></tbody>
  </table>
</div>

<script>
const API = "https://youcaps-api.onrender.com"
let adminKey = ""

function doLogout() {
  adminKey = ""
  sessionStorage.removeItem("youcaps_admin_key")
  document.getElementById("loginView").style.display = "flex"
  document.getElementById("dashView").style.display = "none"
  document.getElementById("keyInput").value = ""
}

async function doLogin() {
  const key = document.getElementById("keyInput").value.trim()
  if (!key) return
  document.getElementById("loginErr").textContent = ""
  try {
    const r = await fetch(API + "/api/admin/stats", { headers: { "X-Admin-Key": key } })
    if (!r.ok) { document.getElementById("loginErr").textContent = "Ongeldige key."; return }
    adminKey = key
    sessionStorage.setItem("youcaps_admin_key", key)
    showDash(await r.json())
    loadSubs()
  } catch(e) { document.getElementById("loginErr").textContent = "Verbindingsfout." }
}

function showDash(stats) {
  document.getElementById("loginView").style.display = "none"
  document.getElementById("dashView").style.display = "block"
  document.getElementById("statsGrid").innerHTML =
    stat("Actief", stats.active, "abonnementen", "green") +
    stat("MRR", "€" + stats.mrr_eur, "per maand") +
    stat("Early bird", stats.early_bird_left, "plekken over", "orange") +
    stat("In afwachting", stats.pending, "niet betaald") +
    stat("Opgezegd", stats.cancelled, "totaal")
  const pct = Math.min(100, Math.round(stats.early_bird_taken / stats.early_bird_limit * 100))
  document.getElementById("earlyBar").innerHTML =
    "<h2>Early bird voortgang — " + stats.early_bird_taken + " / " + stats.early_bird_limit + "</h2>" +
    '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="bar-labels"><span>' + stats.early_bird_taken + ' genomen</span><span>' + stats.early_bird_left + ' over</span></div>'
}

function stat(label, value, sub, cls) {
  return '<div class="stat ' + (cls||'') + '"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div><div class="stat-sub">' + sub + '</div></div>'
}

async function loadSubs() {
  const r = await fetch(API + "/api/admin/subscriptions", { headers: { "X-Admin-Key": adminKey } })
  const subs = await r.json()
  const tbody = document.getElementById("subTable")
  if (!subs.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Nog geen abonnementen.</td></tr>'; return }
  tbody.innerHTML = subs.map(function(s) {
    return "<tr><td>" + s.email + "</td><td><span class='badge " + s.status + "'>" + s.status + "</span></td><td>" + s.plan + "</td><td>€" + s.amount + "</td><td>" + (s.created_at ? new Date(s.created_at).toLocaleDateString("nl-NL") : "—") + "</td><td>" + (s.cancelled_at ? new Date(s.cancelled_at).toLocaleDateString("nl-NL") : "—") + "</td></tr>"
  }).join("")
}

var saved = sessionStorage.getItem("youcaps_admin_key")
if (saved) { document.getElementById("keyInput").value = saved; doLogin() }
</script>
</body>
</html>
