<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>Ovari — Menstruation Tracker</title>
    <meta name="description" content="Track your menstrual cycle with Ovari. Secure, private health tracking for better insights." />

    <!-- PWA: installeerbaar op het beginscherm -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F6F1EC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ovari" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ovari — Menstruation Tracker" />
    <meta property="og:description" content="Track your menstrual cycle, manage your health data, and get personalized insights." />
    <meta property="og:url" content="https://ovari.youcaps.app" />
    <meta property="og:type" content="website" />

    <!-- Analytics: Google Analytics 4 — laadt PAS na expliciete consent (GDPR).
         De banner in de app roept window.initAnalytics() aan na akkoord. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.initAnalytics = function () {
        // Dev-guard: Vite draait op localhost MET poort (bijv. :5175). De
        // native Capacitor-app serveert vanaf https://localhost ZONDER poort
        // en moet juist wel meetellen (anders zijn Play Store-gebruikers
        // onzichtbaar in GA4).
        var dev = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port !== '';
        if (dev) return;
        if (window.__gaLoaded) return;
        window.__gaLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Q9FW3RS7H5';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('set', 'user_properties', {
          platform: window.Capacitor ? 'android_app' : 'web'
        });
        gtag('config', 'G-Q9FW3RS7H5', {
          anonymize_ip: true,
          cookie_flags: 'SameSite=None;Secure'
        });
      };
      try {
        if (localStorage.getItem('femflow_analytics_consent') === 'granted') {
          window.initAnalytics();
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        /* Neutrals — warm-tinted, never pure black/grey */
        --bg:            #F6F1EC;
        --surface:       #FFFFFF;
        --surface-warm:  #FBF6F1;
        --ink:           #2A211C;
        --ink-2:         #6E635B;
        --ink-3:         #A89E95;
        --border:        #E8E0D8;
        --border-subtle: #F1EBE4;

        /* Brand accent — warm tan */
        --accent:        #D4A373;
        --accent-soft:   #ECE0D2;

        /* Status — visually distinct from phases AND accent */
        --success:       #4F8C5A;
        --error:         #C0492D;
        --info:          #5B7C99;

        /* Cycle phases — FUNCTIONAL namespace (never reuse for UI status) */
        --phase-menstrual:   #D96A7A;
        --phase-follicular:  #86B96A;
        --phase-ovulation:   #E6B84A;
        --phase-luteal:      #9B8BC9;

        /* Dark theme (Oura-gevoel in warm bruin, glassmorphism) — d-prefix */
        --d-bg:          #211C1A;      /* basiskleur, diep warm bruin */
        --d-page:        radial-gradient(ellipse at 80% 100%, rgba(212, 163, 115, 0.38) 0%, transparent 60%),
                         radial-gradient(ellipse at 10% 80%, rgba(212, 163, 115, 0.14) 0%, transparent 60%),
                         #211C1A;      /* warme gloed: caramel onderaan, rose links (lichtstreep verwijderd) */
        --d-card-glans:  inset 0 1px 0 rgba(255, 255, 255, 0.09);  /* lichtrand op glas */
        --d-card:        rgba(255, 248, 240, 0.045);  /* glas: combineer met backdropFilter blur */
        --d-card-solid:  rgba(255, 248, 240, 0.035);  /* kleine vlakken, chips */
        --d-ink:         #F5F2EB;      /* crème primaire tekst */
        --d-ink-2:       #CFC4B6;      /* secundair */
        --d-ink-3:       #9C8E7E;      /* tertiair, labels */
        --d-border:      rgba(245, 242, 235, 0.08);
        --d-shadow:      0 10px 30px rgba(0, 0, 0, 0.45);
        --d-accent:      #D4A373;      /* zelfde caramel, knalt op donker */
        --d-accent-soft: rgba(212, 163, 115, 0.16);

        /* Typography */
        --font-display: 'Cinzel', Georgia, serif;
        --font-sans:    'Hanken Grotesk', system-ui, sans-serif;

        --font-size-display: 34px;
        --font-size-h1:      26px;
        --font-size-h2:      20px;
        --font-size-body:    15px;
        --font-size-small:   13px;
        --font-size-micro:   11px;

        --font-weight-light:    300;
        --font-weight-regular:  400;
        --font-weight-medium:   500;
        --font-weight-semibold: 600;

        /* Geometry */
        --radius-sm:   8px;
        --radius-md:   16px;
        --radius-lg:   24px;
        --radius-pill: 999px;

        /* Spacing */
        --space-xs:  8px;
        --space-sm:  16px;
        --space-md:  24px;
        --space-lg:  32px;
        --space-xl:  40px;
        --space-xxl: 56px;

        /* Elevation */
        --shadow-sm: 0 1px 2px rgba(42, 33, 28, 0.06);
        --shadow-md: 0 6px 20px rgba(42, 33, 28, 0.08);

        /* Container */
        --container-max:     480px;
        --container-padding: 30px;
        --transition-fast:   0.25s ease;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        -webkit-font-smoothing: antialiased;
        overflow-y: scroll;
        scrollbar-width: none;
      }

      html::-webkit-scrollbar { display: none; }

      body {
        font-family: var(--font-sans);
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-regular);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }

      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea, select { font-family: inherit; font-size: inherit; }
      ::placeholder { color: var(--ink-3); }
      #root { min-height: 100vh; }

      @keyframes fade-slide-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .fade-up   { animation: fade-slide-up 0.24s ease both; }
      .delay-1   { animation-delay: 0.08s; }
      .delay-2   { animation-delay: 0.16s; }
      .delay-3   { animation-delay: 0.24s; }
      .delay-4   { animation-delay: 0.32s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
