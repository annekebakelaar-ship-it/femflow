<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>FemFlow — Menstruation Tracker</title>
    <meta name="description" content="Track your menstrual cycle with FemFlow. Secure, private health tracking for better insights." />

    <!-- PWA: installeerbaar op het beginscherm -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F6F1EC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FemFlow" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="FemFlow — Menstruation Tracker" />
    <meta property="og:description" content="Track your menstrual cycle, manage your health data, and get personalized insights." />
    <meta property="og:url" content="https://femflow.youcaps.app" />
    <meta property="og:type" content="website" />

    <!-- Analytics: Google Analytics 4 — laadt PAS na expliciete consent (GDPR).
         De banner in de app roept window.initAnalytics() aan na akkoord. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.initAnalytics = function () {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
        if (window.__gaLoaded) return;
        window.__gaLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Q9FW3RS7H5';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-Q9FW3RS7H5', {
          anonymize_ip: true,
          cookie_flags: 'SameSite=None;Secure'
        });
      };
      try {
        if (localStorage.getItem('femflow_analytics_consent') === 'granted') {
          window.initAnalytics();
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />

    <style>
      :root {
        /* Neutrals — warm-tinted, never pure black/grey */
        --bg:            #F6F1EC;
        --surface:       #FFFFFF;
        --surface-warm:  #FBF6F1;
        --ink:           #2A211C;
        --ink-2:         #6E635B;
        --ink-3:         #A89E95;
        --border:        #E8E0D8;
        --border-subtle: #F1EBE4;

        /* Brand accent — warm tan */
        --accent:        #C79A6E;
        --accent-soft:   #ECE0D2;

        /* Status — visually distinct from phases AND accent */
        --success:       #4F8C5A;
        --error:         #C0492D;
        --info:          #5B7C99;

        /* Cycle phases — FUNCTIONAL namespace (never reuse for UI status) */
        --phase-menstrual:   #D96A7A;
        --phase-follicular:  #86B96A;
        --phase-ovulation:   #E6B84A;
        --phase-luteal:      #9B8BC9;

        /* Dark theme (Oura-gevoel in warm bruin, glassmorphism) — d-prefix */
        --d-bg:          #1B0F07;      /* basiskleur, diep warm bruin */
        --d-page:        radial-gradient(ellipse at 80% 100%, rgba(214, 160, 106, 0.55) 0%, transparent 60%),
                         radial-gradient(ellipse at 10% 80%, rgba(217, 106, 122, 0.28) 0%, transparent 60%),
                         #1B0F07;      /* warme gloed: caramel onderaan, rose links (lichtstreep verwijderd) */
        --d-card-glans:  inset 0 1px 0 rgba(255, 255, 255, 0.09);  /* lichtrand op glas */
        --d-card:        rgba(255, 248, 240, 0.045);  /* glas: combineer met backdropFilter blur */
        --d-card-solid:  rgba(255, 248, 240, 0.035);  /* kleine vlakken, chips */
        --d-ink:         #F4ECE3;      /* crème primaire tekst */
        --d-ink-2:       #CDBBAB;      /* secundair */
        --d-ink-3:       #97836F;      /* tertiair, labels */
        --d-border:      rgba(244, 236, 227, 0.08);
        --d-shadow:      0 10px 30px rgba(0, 0, 0, 0.45);
        --d-accent:      #C79A6E;      /* zelfde caramel, knalt op donker */
        --d-accent-soft: rgba(199, 154, 110, 0.16);

        /* Typography */
        --font-display: 'Fraunces', Georgia, serif;
        --font-sans:    'Hanken Grotesk', system-ui, sans-serif;

        --font-size-display: 34px;
        --font-size-h1:      26px;
        --font-size-h2:      20px;
        --font-size-body:    15px;
        --font-size-small:   13px;
        --font-size-micro:   11px;

        --font-weight-light:    300;
        --font-weight-regular:  400;
        --font-weight-medium:   500;
        --font-weight-semibold: 600;

        /* Geometry */
        --radius-sm:   8px;
        --radius-md:   16px;
        --radius-lg:   24px;
        --radius-pill: 999px;

        /* Spacing */
        --space-xs:  8px;
        --space-sm:  16px;
        --space-md:  24px;
        --space-lg:  32px;
        --space-xl:  40px;
        --space-xxl: 56px;

        /* Elevation */
        --shadow-sm: 0 1px 2px rgba(42, 33, 28, 0.06);
        --shadow-md: 0 6px 20px rgba(42, 33, 28, 0.08);

        /* Container */
        --container-max:     480px;
        --container-padding: 30px;
        --transition-fast:   0.25s ease;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        -webkit-font-smoothing: antialiased;
        overflow-y: scroll;
        scrollbar-width: none;
      }

      html::-webkit-scrollbar { display: none; }

      body {
        font-family: var(--font-sans);
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-regular);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }

      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea, select { font-family: inherit; font-size: inherit; }
      ::placeholder { color: var(--ink-3); }
      #root { min-height: 100vh; }

      @keyframes fade-slide-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .fade-up   { animation: fade-slide-up 0.24s ease both; }
      .delay-1   { animation-delay: 0.08s; }
      .delay-2   { animation-delay: 0.16s; }
      .delay-3   { animation-delay: 0.24s; }
      .delay-4   { animation-delay: 0.32s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
