<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>Wearable Age — YOUCAPS</title>
    <meta name="description" content="Calculate your biological age from real wearable data. Powered by longevity science." />

    <!-- Open Graph -->
    <meta property="og:title" content="What is your biological age? — YOUCAPS" />
    <meta property="og:description" content="Calculate your Wearable Age from HRV, resting heart rate, and deep sleep. Free, instant result." />
    <meta property="og:url" content="https://age-sync.youcaps.app" />
    <meta property="og:type" content="website" />

    <!-- Analytics -->
    <script defer data-domain="age-sync.youcaps.app" src="https://plausible.io/js/script.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        /* Neutrals — warm-tinted, never pure black/grey */
        --bg:            #F6F1EC;
        --surface:       #FFFFFF;
        --surface-warm:  #FBF6F1;
        --ink:           #2A211C;
        --ink-2:         #6E635B;
        --ink-3:         #A89E95;
        --border:        #E8E0D8;
        --border-subtle: #F1EBE4;

        /* Brand accent — warm tan */
        --accent:        #C79A6E;
        --accent-soft:   #ECE0D2;

        /* Status — visually distinct from phases AND accent */
        --success:       #4F8C5A;
        --error:         #C0492D;
        --info:          #5B7C99;

        /* Cycle phases — FUNCTIONAL namespace (never reuse for UI status) */
        --phase-menstrual:   #D96A7A;
        --phase-follicular:  #86B96A;
        --phase-ovulation:   #E6B84A;
        --phase-luteal:      #9B8BC9;

        /* Typography */
        --font-display: 'Fraunces', Georgia, serif;
        --font-sans:    'Hanken Grotesk', system-ui, sans-serif;

        --font-size-display: 34px;
        --font-size-h1:      26px;
        --font-size-h2:      20px;
        --font-size-body:    15px;
        --font-size-small:   13px;
        --font-size-micro:   11px;

        --font-weight-light:    300;
        --font-weight-regular:  400;
        --font-weight-medium:   500;
        --font-weight-semibold: 600;

        /* Geometry */
        --radius-sm:   8px;
        --radius-md:   16px;
        --radius-lg:   24px;
        --radius-pill: 999px;

        /* Spacing */
        --space-xs:  8px;
        --space-sm:  16px;
        --space-md:  24px;
        --space-lg:  32px;
        --space-xl:  40px;
        --space-xxl: 56px;

        /* Elevation */
        --shadow-sm: 0 1px 2px rgba(42, 33, 28, 0.06);
        --shadow-md: 0 6px 20px rgba(42, 33, 28, 0.08);

        /* Container */
        --container-max:     480px;
        --container-padding: 30px;
        --transition-fast:   0.25s ease;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        -webkit-font-smoothing: antialiased;
        overflow-y: scroll;
        scrollbar-width: none;
      }

      html::-webkit-scrollbar { display: none; }

      body {
        font-family: var(--font-sans);
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-regular);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }

      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea, select { font-family: inherit; font-size: inherit; }
      ::placeholder { color: var(--ink-3); }
      #root { min-height: 100vh; }

      @keyframes fade-slide-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .fade-up   { animation: fade-slide-up 0.24s ease both; }
      .delay-1   { animation-delay: 0.08s; }
      .delay-2   { animation-delay: 0.16s; }
      .delay-3   { animation-delay: 0.24s; }
      .delay-4   { animation-delay: 0.32s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
